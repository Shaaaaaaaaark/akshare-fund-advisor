# Fund Advisor MCP and LangGraph Agent configuration.
#
# Copy this file to config/config.local.yaml for local secrets.
# Environment variables override YAML with FINAGENT__SECTION__KEY.

mcp:
  # Local Agent defaults to stdio. Docker overrides this to http.
  transport: stdio
  server_command: ""
  server_url: http://127.0.0.1:8001/mcp
  host: 127.0.0.1
  port: 8001
  timeout_seconds: 60
  concurrency: 2

web_research:
  enabled: false
  transport: stdio
  server_command: ""
  server_url: http://127.0.0.1:8002/mcp
  host: 127.0.0.1
  port: 8002
  timeout_seconds: 20
  max_results: 10
  max_content_chars: 12000
  max_fetch_bytes: 2097152
  fetch_concurrency: 3
  allowed_domains: []
  search_language: zh-hans
  search_chain: [serper, tavily, google_cse, brave, serpapi]
  providers:
    serper:
      api_key: ""
    tavily:
      api_key: ""
    google_cse:
      api_key: ""
      cx: ""
    brave:
      api_key: ""
    serpapi:
      api_key: ""
  # Legacy single-provider fields are read during local migration.
  provider: brave
  api_key: ""
  search_api_url: https://api.search.brave.com/res/v1/web/search

model:
  enabled: false
  provider: openai
  base_url: https://api.deepseek.com
  api_key: ""
  model: ""
  temperature: 0.1
  max_tokens: 1500
  timeout_seconds: 30
  extra_body: {}

agent:
  use_llm_for_intent: false
  use_llm_for_associations: false
  maximum_facts: 20
  maximum_tool_calls: 4
