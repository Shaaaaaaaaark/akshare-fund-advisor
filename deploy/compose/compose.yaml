name: fund-advisor

x-app-build: &app-build
  context: ../..
  dockerfile: Dockerfile
  target: runtime

services:
  web-backend:
    image: fund-advisor-web-backend:local
    build:
      context: ../..
      dockerfile: Dockerfile
      target: web-backend
    init: true
    restart: unless-stopped
    depends_on:
      agent-api:
        condition: service_healthy
      data-api:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WEB_BACKEND_ADDR: ":8080"
      DATA_API_URL: http://data-api:8003
      AGENT_API_URL: http://agent-api:8000
      MYSQL_URL: jdbc:mysql://mysql:3306/fund_advisor?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      MYSQL_USER: fund_advisor
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fund_advisor_dev}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DASHBOARD_INDEX_UNIVERSE: "沪深300,中证500,中证1000,上证50,创业板50,中证800"
      DASHBOARD_INDEX_YEARS: "10"
      DASHBOARD_CONCURRENCY: "4"
      DASHBOARD_RATE_LIMIT_ENABLED: "true"
      DASHBOARD_RATE_LIMIT_REQUESTS: "120"
      DASHBOARD_RATE_LIMIT_WINDOW_SECONDS: "60"
      DASHBOARD_OVERVIEW_INDEX: "沪深300"
      DASHBOARD_OVERVIEW_ETF: "510310"
      DASHBOARD_OVERVIEW_FUND: "000001"
      DASHBOARD_OVERVIEW_STOCK: "600519"
      DATA_API_TIMEOUT_SECONDS: "90"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - "${FUND_ADVISOR_PORT:-8080}:8080"

  data-api:
    image: fund-advisor-app:local
    build: *app-build
    init: true
    restart: unless-stopped
    command:
      ["fund-advisor-data-api", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      FINAGENT_SKILL_DIR: /app/skills/akshare-fund-advisor
      AKSHARE_FUND_SOURCE_VALIDATION: ${AKSHARE_FUND_SOURCE_VALIDATION:-baostock}
      AKSHARE_FUND_SOURCE_VALIDATION_TIMEOUT: ${AKSHARE_FUND_SOURCE_VALIDATION_TIMEOUT:-8}
    volumes:
      - ../../config:/app/config:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    expose:
      - "8003"

  agent-api:
    image: fund-advisor-app:local
    build: *app-build
    init: true
    restart: unless-stopped
    command: ["fund-advisor-api", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      fund-advisor-mcp:
        condition: service_healthy
      web-research-mcp:
        condition: service_healthy
    environment:
      FINAGENT__MCP__TRANSPORT: http
      FINAGENT__MCP__SERVER_URL: http://fund-advisor-mcp:8001/mcp
      FINAGENT__WEB_RESEARCH__TRANSPORT: http
      FINAGENT__WEB_RESEARCH__SERVER_URL: http://web-research-mcp:8002/mcp
      FINAGENT__APP__HOST: 0.0.0.0
      FINAGENT__APP__PORT: 8000
      FINAGENT_SKILL_DIR: /app/skills/akshare-fund-advisor
    volumes:
      - ../../config:/app/config:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    expose:
      - "8000"

  fund-advisor-mcp:
    image: fund-advisor-app:local
    build: *app-build
    init: true
    restart: unless-stopped
    command: ["fund-advisor-mcp"]
    environment:
      FINAGENT__MCP__TRANSPORT: http
      FINAGENT__MCP__HOST: 0.0.0.0
      FINAGENT__MCP__PORT: 8001
      FINAGENT_SKILL_DIR: /app/skills/akshare-fund-advisor
      AKSHARE_FUND_SOURCE_VALIDATION: ${AKSHARE_FUND_SOURCE_VALIDATION:-baostock}
      AKSHARE_FUND_SOURCE_VALIDATION_TIMEOUT: ${AKSHARE_FUND_SOURCE_VALIDATION_TIMEOUT:-8}
    volumes:
      - ../../config:/app/config:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 8001), 2); s.close()",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    expose:
      - "8001"

  web-research-mcp:
    image: fund-advisor-app:local
    build: *app-build
    init: true
    restart: unless-stopped
    command: ["web-research-mcp"]
    environment:
      FINAGENT__WEB_RESEARCH__ENABLED: "true"
      FINAGENT__WEB_RESEARCH__TRANSPORT: http
      FINAGENT__WEB_RESEARCH__HOST: 0.0.0.0
      FINAGENT__WEB_RESEARCH__PORT: 8002
    volumes:
      - ../../config:/app/config:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 8002), 2); s.close()",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    expose:
      - "8002"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fund_advisor
      MYSQL_USER: fund_advisor
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fund_advisor_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fund_advisor_root_dev}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    expose:
      - "3306"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    expose:
      - "6379"

  test:
    profiles: ["test"]
    image: fund-advisor-test:local
    build:
      context: ../..
      dockerfile: Dockerfile
      target: test

volumes:
  mysql-data:
  redis-data:
