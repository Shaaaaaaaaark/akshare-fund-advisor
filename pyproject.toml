[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akshare-fund-advisor"
version = "0.1.0"
description = "Audited LangGraph research agent for Chinese funds and stocks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "akshare-fund-advisor contributors"}]
dependencies = [
    "akshare==1.18.64",
    "baostock==0.9.3",
    "pandas==2.3.3",
    "numpy==2.0.2",
    "requests==2.32.5",
    "curl_cffi==0.13.0",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "langgraph==1.2.10",
    "mcp==1.29.0",
    "openai==2.53.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "pypdf==6.14.2",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "rich==14.1.0",
]

[project.scripts]
fund-advisor-mcp = "fund_advisor_mcp.fund.server:main"
web-research-mcp = "fund_advisor_mcp.web.server:main"
fund-advisor-api = "fund_advisor_app.api:main"
fund-advisor-data-api = "fund_advisor_data_api.api:main"
fund-advisor = "fund_advisor_app.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "fund_advisor_mcp*",
    "fund_advisor_agent*",
    "fund_advisor_app*",
    "fund_advisor_data_api*",
]

[tool.pytest.ini_options]
testpaths = ["tests", "skills/akshare-fund-advisor/tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
