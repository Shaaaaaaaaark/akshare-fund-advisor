server:
  port: ${WEB_BACKEND_PORT:8080}

spring:
  application:
    name: fund-advisor-web-backend
  main:
    banner-mode: "off"
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/fund_advisor?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USER:fund_advisor}
    password: ${MYSQL_PASSWORD:fund_advisor_dev}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_SIZE:8}
      minimum-idle: ${MYSQL_MIN_IDLE:1}
      connection-timeout: 3000
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s
      repositories:
        enabled: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
